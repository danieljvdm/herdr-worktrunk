id = "worktrunk"
name = "Worktrunk"
version = "0.7.1"
min_herdr_version = "0.7.0"
description = "Switch, create, or remove git worktrees via worktrunk"
platforms = ["macos", "linux"]

# Workspace actions: open the picker in a split pane. Plugin panes default their cwd to
# the plugin root, so pass --cwd = the workspace's repo (from the injected context JSON);
# otherwise `wt` runs in the plugin dir, not the repo you're in.
[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
command = ["bash", "-c", "cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd' <<<\"$HERDR_PLUGIN_CONTEXT_JSON\"); exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint picker-default --placement split --direction down --cwd \"$cwd\" --focus"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
command = ["bash", "-c", "cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd' <<<\"$HERDR_PLUGIN_CONTEXT_JSON\"); exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint picker-current --placement split --direction down --cwd \"$cwd\" --focus"]

# Dispatch action: task-first spawn. Opens a compact composer popup where you
# describe the work; the branch name is derived from the text, the worktree is
# created via wt (hooks run), and a coding agent starts in it with the task as
# its opening prompt. From a workspace the target repo is that workspace's;
# invoked globally the composer resolves it from the task text (>repo token or
# a repo name mentioned in it) with an fzf picker as fallback.
[[actions]]
id = "dispatch"
title = "Sow: worktree + agent from a task prompt"
contexts = ["workspace", "global"]
command = ["bash", "-c", "cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd // empty' <<<\"$HERDR_PLUGIN_CONTEXT_JSON\"); if [ -n \"$cwd\" ]; then exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint composer --placement popup --width 78 --height 18 --cwd \"$cwd\" --focus; else exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint composer --placement popup --width 78 --height 18 --cwd \"$HOME\" --env WORKTRUNK_COMPOSER_GLOBAL=1 --focus; fi"]

# Remove actions: direct current-worktree removal for the common case, plus the
# picker for cleanup elsewhere. Both pin the invoking workspace and the
# resolved worktree path (herdr's own worktree model) into the remover pane's
# environment at keypress time — focus can move before the pane opens, and
# re-deriving the target from ambient focus has removed the wrong worktree.
[[actions]]
id = "remove-current"
title = "Worktree: remove current"
contexts = ["workspace"]
command = ["bash", "-c", "ctx=\"$HERDR_PLUGIN_CONTEXT_JSON\"; ws=$(jq -r '.workspace_id // empty' <<<\"$ctx\"); wslabel=$(jq -r '.workspace_label // empty' <<<\"$ctx\"); checkout=$(jq -r '.worktree.checkout_path // empty' <<<\"$ctx\"); pane=$(jq -r '.focused_pane_id // empty' <<<\"$ctx\"); cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd' <<<\"$ctx\"); open_remover() { \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint remover-current --placement split --direction down --cwd \"$cwd\" --env WORKTRUNK_REMOVE_CHECKOUT=\"$checkout\" --env WORKTRUNK_REMOVE_WORKSPACE=\"$ws\" --env WORKTRUNK_REMOVE_WORKSPACE_LABEL=\"$wslabel\" --focus \"$@\"; }; if [ -n \"$pane\" ]; then open_remover --target-pane \"$pane\" || open_remover; else open_remover; fi"]

[[actions]]
id = "remove"
title = "Worktree: remove any"
contexts = ["workspace"]
command = ["bash", "-c", "ctx=\"$HERDR_PLUGIN_CONTEXT_JSON\"; pane=$(jq -r '.focused_pane_id // empty' <<<\"$ctx\"); cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd' <<<\"$ctx\"); open_remover() { \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint remover --placement split --direction down --cwd \"$cwd\" --focus \"$@\"; }; if [ -n \"$pane\" ]; then open_remover --target-pane \"$pane\" || open_remover; else open_remover; fi"]

# PR status: report the current worktree's GitHub PR (if any) as workspace
# metadata (a `$pr` token for [ui.sidebar.spaces]), and open it in a browser.
# refresh-pr runs on-demand; the worktrunk post-switch hook runs report
# automatically on every switch (see pr-status.sh's header comment).
[[actions]]
id = "refresh-pr"
title = "Worktree: refresh PR status"
contexts = ["workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/pr-status.sh\" report"]

[[actions]]
id = "open-pr"
title = "Worktree: open PR in browser"
contexts = ["workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/pr-status.sh\" open"]

# Plugin panes run as plain bash. Depending on plugin config, picker.sh opens
# the checkout in a tab or registers it as a native herdr worktree workspace.
[[panes]]
id = "picker-default"
title = "Worktrunk — default branch"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --create-base=default"]

[[panes]]
id = "picker-current"
title = "Worktrunk — current branch"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --create-base=current"]

[[panes]]
id = "composer"
title = "Sow — dispatch a task"
placement = "popup"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/composer.sh\""]

[[panes]]
id = "remover"
title = "Worktrunk — remove any"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/remove.sh\" --picker"]

[[panes]]
id = "remover-current"
title = "Worktrunk — remove current"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/remove.sh\" --current"]
